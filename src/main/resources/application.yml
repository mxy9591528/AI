spring:
  datasource:
    url: jdbc:mysql://localhost:3306/ai_db
    username: ai_user
    # 支持环境变量覆盖：DB_PASSWORD
    password: ${DB_PASSWORD:Tustids@0911}

  data:
    redis:
      host: localhost
      port: 6379
      database: 0
      timeout: 3s
      lettuce:
        pool:
          max-active: 8
          max-idle: 8
          min-idle: 2
          max-wait: 1s

  ai:
    openai:
      chat:
        options:
          model: qwen-plus  # 阿里云百炼Qwen模型，可按需更换为 qwen-turbo / qwen-max
      # noinspection SpellCheckingInspection
      # 阿里云百炼平台(DashScope) API Key，支持环境变量覆盖：DASHSCOPE_API_KEY
      api-key: ${DASHSCOPE_API_KEY:sk-ws-H.EXPYMPE.tRUv.MEYCIQD05nZt3Twmqx_gOU1xxumZzWRVCWEaSA9DXwCrMSVSgwIhAM0zRAvTeYh9UswwwJixjst5o0W_ri3bgyupyfPLHwqV}
      base-url: https://dashscope.aliyuncs.com/compatible-mode  # 百炼OpenAI兼容模式地址
# 服务器配置
server:
  port: 1236

# AI供应商切换配置（保留spring.ai.openai为百炼配置）
ai:
  active-provider: bailian  # 启动时使用的供应商：bailian=阿里云百炼(默认) / ollama=本地Ollama
  ollama:
    base-url: http://localhost:11434  # Ollama服务地址（OpenAI兼容模式自动追加/v1）
    api-key: ollama  # Ollama不校验Key，占位即可
    model: qwen3:14b-fast  # 本地已拉取的Qwen模型（ollama list 可查看）

# 日志文件
logging:
  file:
    name: logs/app.log
  level:
    com.example.aispringboot: info

# JWT配置（token 通过自定义请求头 "Token" 传输，见 JwtTokenUtil）
jwt:
  # 支持环境变量覆盖：JWT_SECRET
  secret: ${JWT_SECRET:qwer1234mnbv2026!@#$%^&*()_+Tustids@0911}
  expiration: 86400000  # 24小时（毫秒）

